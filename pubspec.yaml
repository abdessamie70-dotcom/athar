name: athar
description: "Athar (أثر باقٍ) - Mindful productivity and spiritual legacy application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  home_widget: 0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/seed_initiatives.json
