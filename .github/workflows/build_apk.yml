name: Build Athar Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build app-release.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: dart run test/run_parser_tests.dart

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload app-release.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with app-release.apk
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "أثر باقٍ - إصدار رقم 1.0.${{ github.run_number }}"
          body: |
            ## تحميل تطبيق «أثر باقٍ» مباشرة (app-release.apk)
            - **الإصدار:** 1.0.${{ github.run_number }}
            - **معرف التطبيق:** com.abdessamie70.athar
            - **الهدف الأدنى:** Android 5.0 (API 21)+
            - **الملف المرفق:** `app-release.apk` (جاهز للتثبيت المباشر على الهاتف)
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
